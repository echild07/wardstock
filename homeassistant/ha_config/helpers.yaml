# Lucius project — HA helper entities for the sync status panel (PLAN.md §9).
#
# RETIRED (Aug 2026, SQLite migration). Every entity that used to live here
# is unused now — all 7 status-writing flows (Oura Sync, GoDaddy Pull, Body
# Composition Import, Medical History Import, wherewhen Data Export/Restore,
# Analysis Engine) write to a shared job_status table in a dedicated SQLite
# database (/share/lucius_status.db) instead, and Status Heartbeat reads
# from that same table rather than these entities. Motivation: each entity
# needed a manually-configured Node-RED "Server" field per flow per install,
# and Status Heartbeat alone was chaining 28 separate HA reads (4 fields ×
# 7 flows) just to build one report — real, recurring setup friction for no
# benefit once nothing in HA's own UI was actually displaying them either
# (dashboard.yaml, retired alongside this file, only ever covered 3 of the
# 7 flows to begin with).
#
# If you already added these to configuration.yaml (or a packages file) from
# an earlier install, they're safe to delete — nothing writes or reads them
# anymore. Left here, commented out, purely as a historical record of the
# entity_ids/shapes that existed before the migration, not something to
# re-add.
